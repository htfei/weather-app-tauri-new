[package]
name = "web-wrapper-app"
version = "1.0.0"
edition = "2021"

[lib]
name = "web_wrapper_app_lib"
crate-type = ["cdylib", "lib"]

[dependencies]
tauri = { version = "2", features = ["wry", "rustls-tls", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
url = "2.5"
lazy_static = "1.4"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
strip = true
codegen-units = 1
lto = "thin"
panic = "abort"
