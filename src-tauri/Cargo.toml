[package]
name = "weather-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "weather_app_lib"
crate-type = ["cdylib", "lib"]

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "rustls-tls", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
strip = true
codegen-units = 1
lto = "thin"
panic = "abort"
