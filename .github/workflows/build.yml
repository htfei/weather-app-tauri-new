name: '自动全平台编译与发布'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 前端环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 底层环境
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-ios,x86_64-apple-ios' || matrix.platform == 'windows-latest' && 'aarch64-linux-android' || '' }}

      - name: 仅在 Linux 上安装必要依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsquashfs-dev libsecret-1-dev

      - name: 仅在 Windows 上安装 Android 编译环境 (NDK)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action-setup-android@v1

      - name: 前端依赖安装
        run: npm install

      - name: 执行云端打包并发布到 GitHub Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          createRelease: true
          args: ${{ matrix.args }}